# 관리자 콘솔 nginx — 템플릿 (컨테이너 시작 시 ${BACKEND_UPSTREAM} 치환)
# BACKEND_UPSTREAM: 기본 sfm-backend:3100 (docker compose 백엔드).
#   운영 맥미니처럼 백엔드가 호스트 pm2 로 돌면 host.docker.internal:3100 등 — README "운영 실행" 참고.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 캐시하지 않음 (재배포 후 예전 청크 참조 방지)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API 프록시 → Backend (기존 frontend/nginx.conf 와 동일 헤더)
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io WebSocket 프록시 (실시간 상태 · 웹 터미널)
    location /socket.io/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 해시된 정적 파일 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
